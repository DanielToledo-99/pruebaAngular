<div class="page">
  <header class="page-header">
    <h1>Inventario de Productos</h1>
    <button pButton type="button" label="Cerrar sesión" class="p-button-text" (click)="logout()"></button>
  </header>

  <div class="toolbar">
    <p-iconField iconPosition="left" class="search-field">
      <p-inputIcon class="pi pi-search"></p-inputIcon>
      <input
        type="text"
        pInputText
        placeholder="Buscar por nombre..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
      />
    </p-iconField>

    <button pButton type="button" icon="pi pi-plus" label="Agregar producto" (click)="openCreateDialog()"></button>
  </div>

  <p-table [value]="products" [loading]="loading" [paginator]="true" [rows]="10" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th class="actions-col">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.description || '—' }}</td>
        <td>{{ product.quantity }}</td>
        <td>{{ product.price | currency: 'USD' }}</td>
        <td class="actions-col">
          <button pButton type="button" icon="pi pi-pencil" class="p-button-text" (click)="openEditDialog(product)"></button>
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-text p-button-danger"
            (click)="confirmDelete(product)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">No hay productos para mostrar</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [modal]="true"
  [header]="editingProduct ? 'Editar producto' : 'Agregar producto'"
  [style]="{ width: '420px' }"
  (onHide)="closeDialog()"
>
  @if (dialogVisible) {
    <app-product-form
      [product]="editingProduct"
      [saving]="saving"
      (save)="handleSave($event)"
      (cancel)="closeDialog()"
    ></app-product-form>
  }
</p-dialog>

<p-confirmDialog></p-confirmDialog>
