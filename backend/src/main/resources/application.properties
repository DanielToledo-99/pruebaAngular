spring.application.name=product-inventory-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:products_db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Credenciales fijas para el login (no hay entidad User ni registro en este alcance)
auth.username=${AUTH_USERNAME:admin}
auth.password=${AUTH_PASSWORD:admin123}

# JWT
jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-1234567890abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS (origen del frontend Angular)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
