spring.application.name=inventario-productos-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventario_db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

autenticacion.usuario=${AUTH_USERNAME:admin}
autenticacion.contrasena=${AUTH_PASSWORD:admin123}

jwt.secreto=${JWT_SECRET:cambia-este-secreto-en-produccion-1234567890abcdef}
jwt.expiracion-ms=${JWT_EXPIRATION_MS:3600000}

aplicacion.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
